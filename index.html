<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diário Padel &amp; Academia</title>
<meta name="description" content="Registro de peso e treinos de academia e padel, com histórico e sugestão de carga.">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c131c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna pensada para o celular (máx. 720px), barra de abas fixa embaixo; cartões só para itens do plano e registros de exercício */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e8ecf2; --line:#d6dde7;
  --ink:#111d2c; --muted:#5a6a7e;
  --court:#1c4d8f; --on-court:#ffffff; --court-soft:#dfe8f5;
  --ball:#bccb22; --ball-ink:#4d5300; --ball-soft:#eff4c4;
  --other:#8a7fb8; --other-soft:#ebe8f6;
  --good:#1d7f55; --good-soft:#dcf1e7; --warn:#9a600e; --warn-soft:#fbeed8; --bad:#b93a34; --bad-soft:#f8e0de;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c131c; --surface:#141e2a; --surface-2:#1c2837; --line:#283648;
    --ink:#e6ecf4; --muted:#93a2b6;
    --court:#6d9fe3; --on-court:#0b1220; --court-soft:#1a2d47;
    --ball:#d3df4c; --ball-ink:#e3ec7a; --ball-soft:#2c3112;
    --other:#a99ee0; --other-soft:#28243f;
    --good:#4cc08b; --good-soft:#15332a; --warn:#e0a44a; --warn-soft:#3a2b14; --bad:#ef7a72; --bad-soft:#3b1c1b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c131c; --surface:#141e2a; --surface-2:#1c2837; --line:#283648;
  --ink:#e6ecf4; --muted:#93a2b6;
  --court:#6d9fe3; --on-court:#0b1220; --court-soft:#1a2d47;
  --ball:#d3df4c; --ball-ink:#e3ec7a; --ball-soft:#2c3112;
  --other:#a99ee0; --other-soft:#28243f;
  --good:#4cc08b; --good-soft:#15332a; --warn:#e0a44a; --warn-soft:#3a2b14; --bad:#ef7a72; --bad-soft:#3b1c1b;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:720px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-top:calc(10px + env(safe-area-inset-top, 0px));padding-bottom:calc(92px + env(safe-area-inset-bottom, 0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--ball);box-shadow:inset -2px -2px 0 rgba(0,0,0,.12)}
.sync{font-size:12px;color:var(--muted)}
main{display:flex;flex-direction:column;gap:26px}
h1{font-family:var(--display);font-weight:700;font-size:36px;line-height:1;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1;margin:0;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:16px;font-weight:600;margin:0;line-height:1.25}
p{margin:0}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.num-t{font-variant-numeric:tabular-nums}
/* botões */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px;cursor:pointer;line-height:1.1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--court);border-color:var(--court);color:var(--on-court)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:14px;min-height:36px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.link{appearance:none;background:none;border:0;padding:0;color:var(--court);font-weight:600;cursor:pointer;font-size:14px}
:focus-visible{outline:2px solid var(--court);outline-offset:2px}
.icon-btn{appearance:none;border:0;background:transparent;width:34px;height:34px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:16px;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.armed{color:var(--bad);background:var(--bad-soft);width:auto;padding:0 10px;font-size:13px;font-weight:600}
/* etiquetas */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tag::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--court)}
.tag.padel::before{background:var(--ball);border-radius:50%}
.tag.other::before{background:var(--other)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.doing{background:var(--court-soft);color:var(--court)}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.reco{background:var(--ball-soft);color:var(--ball-ink)}
/* formulários */
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input.in,select.in,textarea.in{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);width:100%;min-width:0}
textarea.in{min-height:76px;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--court);outline:none;box-shadow:0 0 0 3px var(--court-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}.grid3>:first-child{grid-column:1/-1}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500;cursor:pointer}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
/* plano do dia */
.plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.plan.is-reco{border-color:var(--court);box-shadow:0 0 0 1px var(--court)}
.plan-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plan-head .time{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.plan h3{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.01em}
.plan .focus{color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--court);color:var(--on-court);border-radius:12px;padding:12px 14px}
.banner .btn{background:var(--on-court);color:var(--court);border-color:transparent}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
.notice.info{background:var(--surface-2);color:var(--muted)}
/* semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.day.today{border-color:var(--court);box-shadow:inset 0 0 0 1px var(--court)}
.day .dl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase}
.day .dn{font-family:var(--display);font-size:20px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.day .dp{font-size:11px;color:var(--muted);white-space:nowrap}
.dots{display:flex;gap:3px;min-height:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--court)}
.dot.padel{background:var(--ball)}
.dot.other{background:var(--other)}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tpl{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.tpl:hover{border-color:var(--court)}
.tpl b{font-size:14px}
.tpl small{color:var(--muted);font-size:12px}
.quickw{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.bignum{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bignum small{font-size:18px;color:var(--muted);margin-left:3px}
/* sessão */
.sess-head{display:flex;flex-direction:column;gap:8px}
.group{display:flex;flex-direction:column;gap:10px}
.group-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.group-head .count{font-size:13px;color:var(--muted);flex:1}
.gate{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ex header{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.presc{font-size:13px;color:var(--muted);margin-top:2px}
.presc .role{font-weight:600;color:var(--ink)}
.note{font-size:12.5px;color:var(--warn)}
.last{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.last b{color:var(--ink);font-weight:600}
.sug{display:flex;gap:10px;align-items:center;justify-content:space-between;border-radius:10px;padding:9px 11px;font-size:13px;background:var(--surface-2)}
.sug.good{background:var(--good-soft);color:var(--good)}
.sug.warn{background:var(--warn-soft);color:var(--warn)}
.sug .btn{flex:none}
.sets{display:flex;flex-direction:column;gap:6px}
.set,.set-h{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 44px 30px;gap:6px;align-items:center}
.sets.noload .set,.sets.noload .set-h{grid-template-columns:22px minmax(0,1fr) 44px 30px}
.set-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.set .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;text-align:center}
.set input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;width:100%;min-width:0;text-align:center;font-variant-numeric:tabular-nums}
.set input:focus{border-color:var(--court);outline:none}
.check{appearance:none;width:44px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;color:var(--muted)}
.set.done .check{background:var(--good);border-color:var(--good);color:#fff}
.set.done input{background:var(--good-soft);border-color:transparent}
.picker{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:12px;padding:8px}
.pick-item{appearance:none;display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.pick-item .box{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);margin-top:1px}
.pick-item.on{border-color:var(--court)}
.pick-item.on .box{background:var(--court);border-color:var(--court)}
.pick-item small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.add-ex{display:grid;grid-template-columns:1fr auto;gap:8px}
details.warm{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.warm summary{cursor:pointer;font-weight:600}
.checklist{list-style:none;margin:10px 0 2px;padding:0;display:flex;flex-direction:column;gap:6px}
.checklist label{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.checklist small{color:var(--muted)}
.scale-wrap{display:flex;flex-direction:column;gap:6px}
.scale-label{display:flex;justify-content:space-between;font-size:14px;font-weight:500}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.sc{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;height:34px;font-size:13px;font-variant-numeric:tabular-nums;cursor:pointer;padding:0}
.sc.on{background:var(--good);border-color:var(--good);color:#fff}
.sc.mid.on{background:var(--warn);border-color:var(--warn)}
.sc.hi.on{background:var(--bad);border-color:var(--bad)}
.sc.rpe.on{background:var(--court);border-color:var(--court);color:var(--on-court)}
/* histórico */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .v{font-family:var(--display);font-size:32px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .v small{font-size:16px;color:var(--muted);font-weight:600}
.tile .k{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.meter span{display:block;height:100%;background:var(--court);border-radius:3px}
.heat-wrap{overflow-x:auto}
.heat{display:grid;gap:3px;min-width:300px}
.heat .cell{aspect-ratio:1;border-radius:3px;background:var(--surface-2)}
.heat .cell.gym{background:var(--court)}
.heat .cell.padel{background:var(--ball)}
.heat .cell.other{background:var(--other)}
.heat .cell.mix{background:linear-gradient(135deg,var(--court) 50%,var(--ball) 50%)}
.heat .cell.future{background:transparent;border:1px dashed var(--line)}
.heat .cell.today{outline:2px solid var(--ink);outline-offset:-1px}
.heat .lab{font-size:10px;color:var(--muted);line-height:1;align-self:center;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;background:var(--court);display:inline-block}
.legend i.padel{background:var(--ball)}
.legend i.other{background:var(--other)}
.legend i.mix{background:linear-gradient(135deg,var(--court) 50%,var(--ball) 50%)}
.chart{width:100%;height:auto;display:block}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{appearance:none;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:11px 14px;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;cursor:pointer}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li .d{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);line-height:1.2}
.li .d b{display:block;color:var(--ink);font-size:15px}
.li .t{min-width:0}
.li .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;color:var(--muted);font-size:12.5px}
.month{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:6px 2px 6px}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .kg{font-variant-numeric:tabular-nums;font-weight:600;font-size:16px}
.delta{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:14px}
/* barras fixas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none}
.tabs a svg{width:22px;height:22px}
.tabs a.on{color:var(--court)}
.sessbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sessbar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.timers{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.timers div{display:flex;flex-direction:column;line-height:1.1}
.timers small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.timers b{font-family:var(--display);font-size:24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom, 0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
pre.backup{max-height:200px;overflow:auto;font-size:11px;background:var(--surface-2);padding:10px;border-radius:8px;white-space:pre-wrap;word-break:break-all}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 12px 8px 4px;border-top:1px solid var(--line)}
.cat-row:first-child{border-top:0}
.cat-main{appearance:none;background:transparent;border:0;text-align:left;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;min-width:0}
.cat-main:hover{background:var(--surface-2)}
.cat-main .tag::before{margin-top:1px}
.cat-txt b{display:flex;align-items:center;gap:6px;font-weight:600;flex-wrap:wrap}
.cat-txt small{display:block;color:var(--muted);font-size:12.5px}
.fx{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fx-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.fx-top small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.fx-top small.note{color:var(--warn)}
.fx-icons{display:flex;gap:2px;flex:none}
.icon-btn:disabled{opacity:.3;cursor:default}
.pick-item:disabled{opacity:.5;cursor:default}
.link.how{font-size:13px;margin-top:6px;display:inline-flex;align-items:center;gap:5px}
.link.how::before{content:"";width:0;height:0;border-left:7px solid currentColor;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}

const setRange = str => { const n = (String(str||'').match(/\d+/g) || []).map(Number); return n.length ? {min:n[0], max:n[n.length-1]} : {min:1, max:3}; };
const unitLabel = u => u === 's' ? 's' : u === 'lado' ? '/lado' : u === 'perna' ? '/perna' : '';

/* ---------- estado ---------- */
const DEF = { increment:2, weeklyGoal:4, clearLower:false, clearPadel:false, clearLowerDate:'', clearPadelDate:'' };
const S = {
  view:'hoje', mode:'loading', weights:[], sessions:[], profile:{}, active:null, picker:null,
  loaded:{w:false, s:false}, confirmed:{w:false, s:false}, stale:false,
  wRange:'90', exKey:null, logDate:null, armed:null, lastSetAt:null, dirty:false, backup:false,

const settings = () => Object.assign({}, DEF, (S.profile && S.profile.settings) || {});

/* ---------- armazenamento ---------- */
const LS_KEY = 'diario-treino-v1';
const Store = {
  init() {
    this.loadLocal();
    S.mode = 'local';
    S.loaded = {w:true, s:true}; S.confirmed = {w:true, s:true};
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    window.addEventListener('storage', e => {
      if (e.key !== LS_KEY) return;
      this.loadLocal();
      if (S.active) { const i = S.sessions.findIndex(x => x.id === S.active.id); if (i >= 0) S.sessions[i] = S.active; else S.sessions.push(S.active); }
      renderSafe();
    });
  },
  loadLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) { const d = JSON.parse(raw); S.weights = d.weights || []; S.sessions = d.sessions || []; S.profile = d.profile || {}; }
    } catch (e) { /* sem armazenamento local */ }
  },
  persistLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({weights:S.weights, sessions:S.sessions, profile:S.profile})); }
    catch (e) { toast('Não foi possível salvar neste aparelho. Exporte um backup.'); }
  },
  saveSession() { this.persistLocal(); return Promise.resolve(); },
  deleteSession() { this.persistLocal(); return Promise.resolve(); },
  saveWeight() { this.persistLocal(); return Promise.resolve(); },
  deleteWeight() { this.persistLocal(); return Promise.resolve(); },
  saveProfile() { this.persistLocal(); return Promise.resolve(); },
};

let saveT = null;
function saveSoon() { S.dirty = true; clearTimeout(saveT); saveT = setTimeout(flushSave, 700); }
function flushSave() {
  clearTimeout(saveT); saveT = null;
  if (S.active && S.dirty) { S.dirty = false; S.active.updatedAt = Date.now(); Store.saveSession(S.active); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); else if (S.view === 'sessao') requestWake(); });

/* ---------- histórico e sugestões ---------- */
function workSets(e) { return (e.sets || []).filter(x => x.reps != null && x.reps !== ''); }
function historyFor(key, s) {
  const out = [];
  for (const x of S.sessions) {
    if (x.id === s.id || !x.exercises || x.date > s.date) continue;
    const e = x.exercises.find(y => y.key === key);
    if (!e) continue;
    const sets = workSets(e);
    if (sets.length) out.push({date:x.date, at:x.startedAt || 0, sets, painGlute:x.painGlute, painElbow:x.painElbow});
  }
  return out.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.at - a.at));
}
function exInfo(e) {
  const b = e.exId && BANK[e.exId];
  if (b) return b;
  return { name:e.name, role:'C', sets:'3', reps:e.reps || '', rir:'', notes:'', alts:'', region:'upper', load:true, key:e.key };
}
function fmtSet(x, unit) {
  const r = x.reps != null ? x.reps + (unit === 's' ? ' s' : '') : '?';
  return x.kg != null ? `${fmtKg(x.kg)}×${r}` : r;
}
function suggest(info, hist) {
  const st = settings();
  const rr = repRange(info.reps);
  if (!hist.length) {
    return { kg:null, tone:'', text: info.load && rr.unit !== 's'
      ? 'Primeiro registro deste exercício. Use uma carga que deixe 2–3 repetições em reserva.'
      : 'Primeiro registro deste exercício.' };
  }
  const last = hist[0];
  const ws = last.sets;
  if (!info.load || rr.unit === 's') {
    const allTop = rr.max != null && ws.every(x => x.reps >= rr.max);
    return { kg:null, tone: allTop ? 'good' : '', text: allTop
      ? `Chegou ao topo da faixa (${rr.max}${unitLabel(rr.unit)}) em todas as séries. Mantenha a qualidade; evolua a variação com o profissional.`
      : `Meta: chegar a ${rr.max ?? '?'}${unitLabel(rr.unit)} em todas as séries, com controle.` };
  }
  const loads = ws.map(x => x.kg).filter(n => n != null);
  if (!loads.length) return { kg:null, tone:'', text:'Última vez sem carga registrada.' };
  const top = Math.max(...loads);
  const atTop = ws.filter(x => x.kg === top);
  const sr = setRange(info.sets);
  const painG = last.painGlute ?? 0, painE = last.painElbow ?? 0;
  const painHit = (info.region === 'lower' && painG >= 4) ? ['glúteo/posterior', painG]
               : (info.region === 'upper' && painE >= 4) ? ['cotovelo', painE] : null;
  if (painHit) return { kg: top, tone:'warn',
    text:`Mantenha ${fmtKg(top)} kg: você registrou dor ${painHit[1]}/10 no ${painHit[0]} no último treino. Se persistir ou piorar, reduza e revise com o profissional.` };
  const hit = rr.max != null && atTop.length >= sr.min && atTop.every(x => x.reps >= rr.max);
  if (hit) {
    const kg = round05(top + (Number(st.increment) || 2));
    return { kg, tone:'good', text:`Fez ${rr.max}+ reps em todas as séries com ${fmtKg(top)} kg. Tente ${fmtKg(kg)} kg hoje.` };
  }
  const below = rr.min != null && atTop.some(x => x.reps < rr.min);
  if (below) return { kg: top, tone:'warn', text:`Ficou abaixo de ${rr.min} reps com ${fmtKg(top)} kg. Mantenha a carga (ou reduza um pouco) e priorize a técnica.` };
  return { kg: top, tone:'', text:`Mantenha ${fmtKg(top)} kg e busque ${rr.max} reps em todas as séries antes de subir.` };
}

/* ---------- criação e abertura de sessões ---------- */
function lastSessionOf(tid, beforeDate) {
  return S.sessions.filter(x => x.template === tid && x.date <= beforeDate && x.exercises && x.exercises.length)
    .sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.startedAt || 0) - (a.startedAt || 0))[0];
}
function makeExercise(info, group, date, fakeId) {
  const e = { key: info.key, exId: info.id || null, name: info.name, group, sets: [] };
  const hist = historyFor(info.key, {id: fakeId, date});
  const sug = suggest(info, hist);
  const sr = setRange(info.sets);
  const n = hist[0] ? Math.min(6, Math.max(sr.min, hist[0].sets.length)) : sr.max;
  for (let i = 0; i < n; i++) e.sets.push({ kg: info.load ? (sug.kg ?? (hist[0] ? (hist[0].sets[i] || hist[0].sets[0]).kg : null)) : null, reps: null, done: false });
  return e;
}
function buildSession(tid, variant, date) {
  const T = TEMPLATES[tid];
  const id = uid();
  const isToday = date === todayStr();
  const s = { id, template: tid, date, status: isToday ? 'doing' : 'done', startedAt: Date.now(), finishedAt: null,
    exercises: [], notes: '', painGlute: null, painElbow: null, rpe: null, warm: [], updatedAt: Date.now() };
  if (T.kind === 'activity') {
    s.durationMin = null;
    if (tid === 'PADEL') { s.slot = variant || ''; s.status = 'done'; s.finishedAt = Date.now(); delete s.durationMin; }
    else s.title = '';
    return s;
  }
  for (const x of lineupOf(tid, date)) s.exercises.push(makeExercise(lineupInfo(x), x.group, date, id));
  return s;
}

/* ---------- fichas do catálogo ---------- */
// Ficha = lista de exercícios de um treino. Ordem de prioridade: ficha editada > seleção do último treino > padrão do plano.
function lineupOf(tid, date) {
  const T = TEMPLATES[tid];
  const saved = S.profile && S.profile.lineups && S.profile.lineups[tid];
  if (Array.isArray(saved)) return saved.filter(x => (x.exId && BANK[x.exId]) || x.name).map(x => Object.assign({}, x));
  const prev = lastSessionOf(tid, date || todayStr());
  if (prev) return prev.exercises.map(e => BANK[e.exId] ? {exId: e.exId, group: e.group} : {name: e.name, key: e.key, group: e.group || 'Extras'});
  return (T.groups || []).flatMap(g => g.defaults.map(id => ({exId: id, group: g.name})));
}
function lineupInfo(x) {
  return x.exId && BANK[x.exId] ? BANK[x.exId] : { name: x.name, key: x.key || slug(x.name), reps: '', sets: '3', load: true, region: 'upper', role: 'C', notes: '', rir: '' };
}
function setLineup(tid, list) {
  const order = (TEMPLATES[tid].groups || []).map(g => g.name);
  const rank = g => { const i = order.indexOf(g); return i < 0 ? 999 : i; };
  const clean = list.map((x, i) => [x, i]).sort((a, b) => rank(a[0].group) - rank(b[0].group) || a[1] - b[1])
    .map(([x]) => x.exId && BANK[x.exId] ? {exId: x.exId, group: x.group} : {name: x.name, key: x.key || slug(x.name), group: x.group});
  S.profile = Object.assign({}, S.profile, { lineups: Object.assign({}, (S.profile && S.profile.lineups) || {}, {[tid]: clean}) });
  Store.saveProfile();
}
function resetLineup(tid) {
  const l = Object.assign({}, (S.profile && S.profile.lineups) || {}); delete l[tid];
  S.profile = Object.assign({}, S.profile, { lineups: l });
  Store.saveProfile();
}
const isEditable = tid => TEMPLATES[tid] && TEMPLATES[tid].kind === 'gym';
function startSession(tid, variant, date) {
  const d = date || todayStr();
  const s = buildSession(tid, variant, d);
  S.sessions.push(s);
  S.active = s; S.picker = null; S.lastSetAt = null;
  S.dirty = true; flushSave();
  go('treino', true);
  if (tid === 'PADEL') toast('Padel marcado como feito' + (d !== todayStr() ? ' em ' + fmtD(d) : '') + '. Informe o esforço.');
  else if (d !== todayStr()) toast('Registrando treino de ' + fmtD(d, {weekday:'long', day:'2-digit', month:'2-digit'}));
}
function openSession(id) {
  const i = S.sessions.findIndex(x => x.id === id);
  if (i < 0) return;
  S.active = clone(S.sessions[i]); S.sessions[i] = S.active; S.picker = null; S.lastSetAt = null;
  go('treino', true);
}
function titleOf(s) {
  const T = TPL(s);
  if (s.template === 'PADEL') return 'Padel' + (s.slot ? ' · ' + s.slot : '');
  if (s.template === 'OUTRO') return s.title || T.title;
  return T.title;
}
function sessionsOn(date) { return S.sessions.filter(x => x.date === date); }

/* ---------- navegação ---------- */
const VIEWS = ['hoje', 'peso', 'historico', 'ajustes', 'treino', 'ficha'];
function go(v, force) {
  if (location.hash === '#' + v) { if (force) route(); }
  else location.hash = v;
}
function route() {
  const h = (location.hash || '').slice(1) || 'hoje';
  const v = VIEWS.includes(h) ? h : 'hoje';
  const prev = S.view;
  if (prev === 'sessao' && v !== 'treino') { flushSave(); S.active = null; S.picker = null; releaseWake(); }
  if (v === 'treino') {
    if (!S.active) {
      const d = S.sessions.filter(x => x.status === 'doing').sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0))[0];
      if (d) { const i = S.sessions.indexOf(d); S.active = clone(d); S.sessions[i] = S.active; }
      else { location.replace('#hoje'); S.view = 'hoje'; render(); return; }
    }
    if (prev !== 'sessao') S.returnTo = prev === 'historico' ? 'historico' : 'hoje';
    S.view = 'sessao';
    if (S.active.status === 'doing' && S.active.date === todayStr()) requestWake();
  } else if (v === 'ficha' && !(S.editTpl && isEditable(S.editTpl))) {
    location.replace('#hoje'); S.view = 'hoje'; render(); return;
  } else S.view = v;
  if (S.view !== 'ficha') S.fxPick = null;
  S.armed = null;
  render();
  if (prev !== S.view || v === 'treino') window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

let wake = null;
async function requestWake() {
  try {
    if (navigator.wakeLock && !wake && document.visibilityState === 'visible') {
      wake = await navigator.wakeLock.request('screen');
      wake.addEventListener('release', () => { wake = null; });
    }
  } catch (e) { wake = null; }
}
function releaseWake() { try { if (wake) wake.release(); } catch (e) {} wake = null; }

/* ---------- renderização ---------- */
function renderSafe() { if (S.view !== 'sessao') render(); else renderSync(); }
function render() {
  const main = $('#main');
  // preserva campos de formulário marcados como "keep"
  const keep = {};
  main.querySelectorAll('[data-keep]').forEach(el => { if (el.id && el.dataset.touched) keep[el.id] = el.value; });
  const focusId = document.activeElement && document.activeElement.id;
  let html = '';
  if (S.view === 'hoje') html = viewHoje();
  else if (S.view === 'peso') html = viewPeso();
  else if (S.view === 'historico') html = viewHistorico();
  else if (S.view === 'ajustes') html = viewAjustes();
  else if (S.view === 'sessao') html = viewSessao();
  else if (S.view === 'ficha') html = viewFicha();
  main.innerHTML = html;
  for (const [id, v] of Object.entries(keep)) { const el = document.getElementById(id); if (el) { el.value = v; el.dataset.touched = '1'; } }
  if (focusId && keep[focusId] != null) { const el = document.getElementById(focusId); if (el) el.focus(); }
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === S.view));
  const inSess = S.view === 'sessao';
  $('#tabs').hidden = inSess;
  $('#sessbar').hidden = !inSess;
  if (inSess) renderBar();
  renderSync();
}
function renderSync() {
  const el = $('#sync');
  if (S.mode === 'loading') el.textContent = 'Carregando…';
  else if (S.mode === 'local') el.textContent = 'Salvo neste aparelho';
  else if (S.stale) el.textContent = 'Sem conexão · pode estar desatualizado';
  else if (!S.loaded.s || !S.loaded.w) el.textContent = 'Carregando seus registros…';
  else el.textContent = 'Salvo na sua conta';
}
const loadingBlock = msg => `<div class="empty">${esc(msg || 'Carregando seus registros…')}</div>`;

/* ---- Hoje ---- */
function planCard(p, date, reco) {
  const T = TEMPLATES[p.t];
  const st = settings();
  const done = sessionsOn(date).filter(x => x.template === p.t && (p.t !== 'PADEL' || (x.slot || '') === (p.slot || '')));
  const doing = done.find(x => x.status === 'doing');
  const fin = done.find(x => x.status === 'done');
  const needs = T.needs === 'lower' && !st.clearLower ? 'Aguardando liberação para inferiores'
             : T.needs === 'padel' && !st.clearPadel ? 'Aguardando liberação para padel' : '';
  const isPadel = p.t === 'PADEL';
  const title = T.title;
  const focus = isPadel ? (fin ? (fin.rpe != null ? `Esforço ${fin.rpe}/10` : 'Esforço não informado') : 'Marque quando jogar e informe o esforço') : T.focus;
  let actions;
  if (doing) actions = `<button class="btn primary" data-act="open" data-id="${doing.id}">Continuar</button>`;
  else if (fin) actions = `<span class="pill done">Feito ✓</span><button class="btn ghost sm" data-act="open" data-id="${fin.id}">${isPadel ? 'Editar esforço' : 'Ver registro'}</button>`;
  else actions = `<button class="btn primary" data-act="start" data-t="${p.t}" data-v="${p.slot || ''}">${isPadel ? 'Marcar feito' : 'Começar treino'}</button>`;
  return `<article class="plan ${reco ? 'is-reco' : ''}">
    <div class="plan-head"><span class="tag ${T.color}">${T.color === 'padel' ? 'Padel' : 'Academia'}</span><span class="time">${esc(p.time)}</span>
      ${reco ? `<span class="pill reco">${esc(reco)}</span>` : ''}${needs ? `<span class="pill warn">${needs}</span>` : ''}</div>
    <div><h3>${esc(title)}</h3><p class="focus">${esc(focus)}</p></div>
    ${T.hint && p.t !== 'PADEL' ? `<p class="hint">${esc(T.hint)}</p>` : ''}
    <div class="row">${actions}</div>
  </article>`;
}
function viewHoje() {
  const t = todayStr(), d = dow(t), st = settings();
  const plans = WEEK[d];
  const doing = S.sessions.filter(x => x.status === 'doing').sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0));
  let headline = plans.length ? (plans[0].t === 'PADEL' ? 'Dia de padel' : d === 3 ? 'Treino B1 ou B2' : TEMPLATES[plans[0].t].title) : 'Descanso';
  let out = `<section class="stack">
    <div class="eyebrow">Hoje · ${WD[d]}, ${fmtD(t, {day:'numeric', month:'long'})}</div>
    <h1>${esc(headline)}</h1>
  </section>`;

  if (doing.length) out += doing.map(s => `<div class="banner"><div><div class="small" style="opacity:.8">Em andamento${s.date !== t ? ' · ' + fmtD(s.date) : ''}</div><b>${esc(titleOf(s))}</b></div>
    <button class="btn sm" data-act="open" data-id="${s.id}">Continuar</button></div>`).join('');

  if (!st.clearLower || !st.clearPadel) {
    out += `<p class="notice">Fase de recuperação: ${[!st.clearLower && 'inferiores', !st.clearPadel && 'padel'].filter(Boolean).join(' e ')} ainda dependem de liberação profissional. Você pode registrar tudo; o app só sinaliza. Ajuste em <a href="#ajustes" class="link">Ajustes</a> quando for liberado.</p>`;
  }

  // planejado para hoje
  out += `<section class="stack"><div class="sec-head"><h2>Planejado</h2><span class="small muted">Semana-alvo do plano</span></div>`;
  if (!plans.length) {
    out += `<div class="plan"><div class="plan-head"><span class="tag other">Recuperação</span></div><div><h3>Descanso geral</h3><p class="focus">Sem treino estruturado. Recuperação completa.</p></div></div>`;
  } else {
    let reco = {};
    if (d === 3) {
      const playedTue = sessionsOn(addDays(t, -1)).some(x => x.template === 'PADEL' && x.slot !== '06h');
      if (playedTue) reco.B1 = 'Recomendado: você jogou ontem';
      else if (st.clearLower) reco.B2 = 'Recomendado: sem jogo ontem';
      else reco.B1 = 'Recomendado até liberar inferiores';
    }
    out += plans.map(p => planCard(p, t, reco[p.t])).join('');
    if (d === 2) out += `<p class="hint">Duas sessões intensas com cerca de 13 h de intervalo. Sem musculação hoje.</p>`;
    if (d === 4) out += `<p class="hint">Sem musculação no mesmo dia do jogo.</p>`;
  }
  out += `</section>`;

  // semana
  const mon = addDays(t, -((d + 6) % 7));
  let week = '';
  for (let i = 0; i < 7; i++) {
    const day = addDays(mon, i), wd = dow(day);
    const dots = sessionsOn(day).map(x => `<span class="dot ${TPL(x).color}"></span>`).join('');
    week += `<div class="day ${day === t ? 'today' : ''}"><span class="dl">${WD_S[wd]}</span><span class="dn">${parseDate(day).getDate()}</span><span class="dp">${WEEK_CODE[wd]}</span><span class="dots">${dots}</span></div>`;
  }
  const weekCount = S.sessions.filter(x => x.date >= mon && x.date <= addDays(mon, 6)).length;
  out += `<section class="stack"><div class="sec-head"><h2>Esta semana</h2><span class="small muted num-t">${weekCount} de ${st.weeklyGoal} treinos na meta</span></div><div class="week">${week}</div></section>`;

  // peso rápido
  const lastW = S.weights[S.weights.length - 1];
  out += `<section class="card"><div class="sec-head"><h2>Peso</h2>${lastW ? `<span class="small muted">Último: ${fmtKg(lastW.kg)} kg em ${fmtD(lastW.date)}</span>` : ''}</div>
    <form class="quickw" data-form="qweight">
      <label class="f">Peso de hoje (kg)<input class="in num-t" id="qw-kg" data-keep inputmode="decimal" autocomplete="off" placeholder="${lastW ? fmtKg(lastW.kg) : 'ex.: 82,0'}"></label>
      <button class="btn primary" type="submit">Salvar</button>
    </form></section>`;

  // catálogo
  const ld = S.logDate || t;
  const past = ld !== t;
  const cat = ['A', 'B1', 'B2', 'C', 'D', 'PADEL', 'FISIO', 'LIVRE', 'OUTRO'];
  const lineups = (S.profile && S.profile.lineups) || {};
  out += `<section class="stack"><div class="sec-head"><h2>Catálogo de treinos</h2><span class="small muted">toque para ver e editar</span></div>
    <label class="f" style="max-width:220px">Data do treino<input class="in" type="date" id="log-date" data-in="log-date" value="${ld}" max="${t}"></label>
    ${past ? `<p class="hint">Registro retroativo: o treino entra direto como feito em ${fmtD(ld, {weekday:'long', day:'2-digit', month:'2-digit'})}.</p>` : ''}
    <div class="list">${cat.map(k => {
      const T = TEMPLATES[k], ed = isEditable(k);
      const n = ed ? lineupOf(k, ld).length : 0;
      const sub = k === 'PADEL' ? 'Feito + esforço' : k === 'OUTRO' ? 'Duração e esforço' : `${T.focus} · ${n} ${n === 1 ? 'exercício' : 'exercícios'}`;
      const label = k === 'PADEL' ? 'Marcar feito' : past ? 'Registrar' : (ed ? 'Começar' : 'Registrar');
      return `<div class="cat-row">
        <button class="cat-main" data-act="${ed ? 'ficha' : 'start-any'}" data-t="${k}" data-k="${k}"><span class="tag ${T.color}"></span>
          <span class="cat-txt"><b>${esc(T.title)}${lineups[k] ? ' <span class="pill">editado</span>' : ''}</b><small>${esc(sub)}</small></span>${ed ? '<span class="muted">›</span>' : ''}</button>
        <button class="btn sm ${ed ? '' : 'ghost'}" data-act="start-any" data-k="${k}">${label}</button></div>`;
    }).join('')}</div>
  </section>`;
  return out;
}

/* ---- Ficha (edição do treino do catálogo) ---- */
function viewFicha() {
  const tid = S.editTpl, T = TEMPLATES[tid];
  const list = lineupOf(tid, todayStr());
  const edited = !!(S.profile && S.profile.lineups && S.profile.lineups[tid]);

function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function lineChart(pts, unit) {

  }

  const line = P.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = pts.length > 1 ? `${line} L${P[P.length - 1][0].toFixed(1)} ${H - B} L${P[0][0].toFixed(1)} ${H - B} Z` : '';

    <path d="${line}" fill="none" stroke="var(--court)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <text x="${Math.min(lp[0], W - R).toFixed(1)}" y="${(lp[1] - 13).toFixed(1)}" text-anchor="${lp[0] > W - 80 ? 'end' : 'middle'}" font-size="18" font-weight="700" fill="var(--ink)">${fmtKg(pts[pts.length - 1].y)} ${unit}</text>

}

    return `<div class="wrow"><div><div class="kg">${fmtKg(w.kg)} kg${w.waist != null ? ` <span class="delta">· cintura ${fmtKg(w.waist)} cm</span>` : ''}</div>
      <div class="delta">${fmtD(w.date, {weekday:'short', day:'2-digit', month:'2-digit', year:'2-digit'})}${prev ? ' · ' + sign(w.kg - prev.kg) + ' kg' : ''}</div></div>
      <span></span><button class="icon-btn ${armed ? 'armed' : ''}" data-act="del-weight" data-d="${w.date}" aria-label="Excluir registro de ${fmtD(w.date)}">${armed ? 'Excluir?' : '✕'}</button></div>`;
  }).join('')}</div></section>`;
  return out;
}

/* ---- Histórico ---- */
const weekStart = s => addDays(s, -((dow(s) + 6) % 7));
function viewHistorico() {
  const t = todayStr(), st = settings();
  let out = `<section class="stack"><div class="eyebrow">Constância e evolução</div><h1>Histórico</h1></section>`;
  if (!S.loaded.s) return out + loadingBlock();
  const all = S.sessions.slice().sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.startedAt || 0) - (a.startedAt || 0));
  const byWeek = {};
  for (const s of all) { const k = weekStart(s.date); byWeek[k] = (byWeek[k] || 0) + 1; }
  const cw = weekStart(t);
  const goal = Math.max(1, Number(st.weeklyGoal) || 4);
  let streak = 0, w = cw;
  if ((byWeek[w] || 0) >= goal) streak++;
  w = addDays(w, -7);
  while ((byWeek[w] || 0) >= goal) { streak++; w = addDays(w, -7); }
  const monthKey = t.slice(0, 7);
  const monthS = all.filter(s => s.date.slice(0, 7) === monthKey);
  const mGym = monthS.filter(s => TPL(s).color !== 'padel').length, mPad = monthS.length - mGym;
  const thisW = byWeek[cw] || 0;
  out += `<section class="tiles">
    <div class="tile"><span class="k">Esta semana</span><span class="v">${thisW}<small>/${goal}</small></span><div class="meter"><span style="width:${Math.min(100, thisW / goal * 100)}%"></span></div></div>
    <div class="tile"><span class="k">Semanas seguidas na meta</span><span class="v">${streak}</span></div>
    <div class="tile"><span class="k">${fmtD(t, {month:'long'})}</span><span class="v">${monthS.length}</span><span class="k">${mGym} academia · ${mPad} padel</span></div>
    <div class="tile"><span class="k">Total registrado</span><span class="v">${all.length}</span></div>
  </section>`;

  // mapa de calor
  const WEEKS = 18;
  const start = addDays(cw, -7 * (WEEKS - 1));
  const kinds = {};
  for (const s of all) { if (s.date < start) continue; (kinds[s.date] = kinds[s.date] || new Set()).add(TPL(s).color); }
  let cells = '', months = '<span></span>';
  let lastMonth = '';
  for (let c = 0; c < WEEKS; c++) {
    const wk = addDays(start, 7 * c);
    const m = parseDate(addDays(wk, 6)).getMonth();
    const lab = (parseDate(addDays(wk, 6)).getDate() <= 7 && String(m) !== lastMonth) || c === 0 ? parseDate(addDays(wk, 6)).toLocaleDateString('pt-BR', {month:'short'}).replace('.', '') : '';
    if (lab) lastMonth = String(m);
    months += `<span class="lab">${lab}</span>`;
  }
  const dl = ['S','T','Q','Q','S','S','D'];
  for (let r = 0; r < 7; r++) {
    cells += `<span class="lab">${r % 2 === 0 ? dl[r] : ''}</span>`;
    for (let c = 0; c < WEEKS; c++) {
      const day = addDays(start, 7 * c + r);
      const k = kinds[day];
      let cls = '';
      if (day > t) cls = 'future';
      else if (k) cls = k.has('gym') && k.has('padel') ? 'mix' : k.has('padel') ? 'padel' : k.has('gym') ? 'gym' : 'other';
      const n = k ? sessionsOn(day).length : 0;
      cells += `<span class="cell ${cls} ${day === t ? 'today' : ''}" title="${fmtD(day, {weekday:'short', day:'2-digit', month:'2-digit'})}${n ? ' · ' + n + ' treino' + (n > 1 ? 's' : '') : ''}"></span>`;
    }
  }
  const cols = `grid-template-columns:14px repeat(${WEEKS},minmax(0,1fr))`;
  out += `<section class="card"><div class="sec-head"><h2>Dias treinados</h2><span class="small muted">últimas ${WEEKS} semanas</span></div>
    <div class="heat-wrap"><div class="heat" style="${cols}">${months}</div><div class="heat" style="${cols};margin-top:4px">${cells}</div></div>
    <div class="legend"><span><i></i>Academia</span><span><i class="padel"></i>Padel</span><span><i class="mix"></i>Os dois</span><span><i class="other"></i>Fisio/outro</span></div></section>`;

  // evolução por exercício
  const exMap = {};
  for (const s of all) for (const e of (s.exercises || [])) {
    const ws = workSets(e).filter(x => x.kg != null);
    if (!ws.length) continue;
    (exMap[e.key] = exMap[e.key] || {name:e.name, pts:[]}).pts.push({x:s.date, y:Math.max(...ws.map(x => x.kg)), sets:ws});
  }
  const keys = Object.keys(exMap).sort((a, b) => exMap[b].pts.length - exMap[a].pts.length || exMap[a].name.localeCompare(exMap[b].name));
  out += `<section class="card"><h2>Evolução por exercício</h2>`;
  if (!keys.length) out += `<p class="muted small">Quando você registrar cargas, escolha um exercício aqui para ver a curva da maior carga por treino.</p>`;
  else {
    const key = keys.includes(S.exKey) ? S.exKey : keys[0];
    const ex = exMap[key];
    const pts = ex.pts.slice().sort((a, b) => a.x < b.x ? -1 : 1);
    const best = pts.reduce((a, b) => b.y > a.y ? b : a);
    out += `<label class="f">Exercício<select class="in" id="ex-sel" data-in="ex-sel">${keys.map(k => `<option value="${esc(k)}" ${k === key ? 'selected' : ''}>${esc(exMap[k].name)} (${exMap[k].pts.length})</option>`).join('')}</select></label>
      ${lineChart(pts, 'kg')}
      <p class="small muted num-t">Recorde: <b style="color:var(--ink)">${fmtKg(best.y)} kg</b> em ${fmtD(best.x)} · primeiro registro: ${fmtKg(pts[0].y)} kg em ${fmtD(pts[0].x)}${pts.length > 1 ? ' · variação ' + sign(pts[pts.length - 1].y - pts[0].y) + ' kg' : ''}</p>`;
  }
  out += `</section>`;

  // lista
  out += `<section class="stack"><h2>Treinos</h2>`;
  if (!all.length) out += `<div class="empty">Nenhum treino ainda. Comece pelo treino de hoje ou registre um anterior na aba Hoje.</div>`;
  else {
    let cur = '', html = '';
    for (const s of all.slice(0, 120)) {
      const mk = s.date.slice(0, 7);
      if (mk !== cur) { if (cur) html += '</div>'; cur = mk; html += `<div class="month">${parseDate(s.date).toLocaleDateString('pt-BR', {month:'long', year:'numeric'})}</div><div class="list">`; }
      html += `<button class="li" data-act="open" data-id="${s.id}"><span class="d">${WD_S[dow(s.date)]}<b class="num-t">${fmtD(s.date)}</b></span>
        <span class="t"><b><span class="tag ${TPL(s).color}" style="vertical-align:1px"></span> ${esc(titleOf(s))}</b><small>${esc(summary(s))}</small></span>
        ${s.status === 'doing' ? '<span class="pill doing">Fazendo</span>' : '<span class="muted">›</span>'}</button>`;
    }
    out += html + '</div>';
  }
  out += `</section>`;
  return out;
}
function summary(s) {
  const T = TPL(s);
  if (T.kind === 'gym') {
    let n = 0, sets = 0, ton = 0;
    for (const e of (s.exercises || [])) { const ws = workSets(e); if (ws.length) n++; sets += ws.length; for (const x of ws) if (x.kg) ton += x.kg * x.reps; }
    return [n + (n === 1 ? ' exercício' : ' exercícios'), sets + ' séries', ton ? fmtInt(ton) + ' kg de volume' : null, s.durationMin ? s.durationMin + ' min' : null].filter(Boolean).join(' · ');
  }
  const res = {v:'vitória', d:'derrota', e:'empate'}[s.result];
  return [s.durationMin ? s.durationMin + ' min' : null, s.rpe != null ? 'esforço ' + s.rpe + '/10' : null, res, s.score || null].filter(Boolean).join(' · ') || 'Sem detalhes';
}

/* ---------- exportação ---------- */
const TYPE_LABEL = { gym:'academia', padel:'padel', other:'outro' };
function buildExport() {
  const ses = S.sessions.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.startedAt || 0) - (b.startedAt || 0));
  const exStats = {};
  const sessions = ses.map(s => {
    const T = TPL(s);
    const o = { id: s.id, started_at: s.startedAt || null, date: s.date, weekday: WD[dow(s.date)], type: s.template === 'FISIO' ? 'fisioterapia' : TYPE_LABEL[T.color], template: s.template, title: titleOf(s), status: s.status === 'done' ? 'feito' : 'em_andamento', effort_0_10: s.rpe ?? null };
    if (s.slot) o.slot = s.slot;
    if (s.durationMin != null) o.duration_min = s.durationMin;
    if (T.kind === 'gym') {
      o.exercises = (s.exercises || []).map(e => {
        const info = exInfo(e);
        const sets = (e.sets || []).map((x, i) => ({ set: i + 1, kg: x.kg ?? null, reps: x.reps ?? null, done: !!x.done }));
        const ws = sets.filter(x => x.reps != null);
        const loads = ws.map(x => x.kg).filter(n => n != null);
        const top = loads.length ? Math.max(...loads) : null;
        if (ws.length) {
          const st = exStats[e.key] = exStats[e.key] || { exercise: e.name, key: e.key, sessions: 0, first_date: s.date, first_top_kg: top, last_date: null, last_top_kg: null, best_kg: null, best_date: null };
          st.sessions++; st.last_date = s.date; st.last_top_kg = top;
          if (top != null && (st.best_kg == null || top > st.best_kg)) { st.best_kg = top; st.best_date = s.date; }
        }
        return { exercise: e.name, key: e.key, group: e.group, plan_id: e.exId || null,
          prescription: info.reps ? { role: info.role === 'P' ? 'Principal' : 'Complementar', sets: info.sets, reps: info.reps, rir: info.rir || null } : null,
          top_kg: top, volume_kg: ws.reduce((n, x) => n + (x.kg || 0) * x.reps, 0), sets };
      });
    }
    return o;
  });
  return {
    app: 'Diário Padel & Academia', exported_at: new Date().toISOString(), schema_version: 1,
    units: { weight: 'kg', load: 'kg', waist: 'cm', effort: '0–10' },
    settings: settings(),
    weights: S.weights.map(w => ({ date: w.date, kg: w.kg, waist_cm: w.waist ?? null })),
    sessions,
    exercise_summary: Object.values(exStats).sort((a, b) => b.sessions - a.sessions),
  };
}
const csvCell = v => { const s = v == null ? '' : String(v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCSV = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\n');
function seriesCSV() {
  const rows = [['date','weekday','type','session','status','effort_0_10','exercise','group','set','kg','reps','done','volume_kg']];
  for (const s of buildExport().sessions) {
    if (!s.exercises || !s.exercises.length) { rows.push([s.date, s.weekday, s.type, s.title, s.status, s.effort_0_10, '', '', '', '', '', '', '']); continue; }
    for (const e of s.exercises) for (const x of e.sets)
      rows.push([s.date, s.weekday, s.type, s.title, s.status, s.effort_0_10, e.exercise, e.group, x.set, x.kg, x.reps, x.done ? 1 : 0, x.kg != null && x.reps != null ? x.kg * x.reps : '']);
  }
  return toCSV(rows);
}
function weightCSV() { return toCSV([['date','kg','waist_cm']].concat(S.weights.map(w => [w.date, w.kg, w.waist ?? '']))); }
async function exportFile(fmt) {
  const d = todayStr();
  const file = fmt === 'json' ? { filename:`diario-treino-${d}.json`, data: JSON.stringify(buildExport(), null, 2) }
             : fmt === 'series' ? { filename:`diario-treino-series-${d}.csv`, data: seriesCSV() }
             : { filename:`diario-treino-peso-${d}.csv`, data: weightCSV() };
  const type = fmt === 'json' ? 'application/json' : 'text/csv';
  const blob = new Blob([file.data], {type: type + ';charset=utf-8'});
  try {
    const f = new File([blob], file.filename, {type});
    if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[f]})) {
      await navigator.share({files:[f], title:file.filename});
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = file.filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Arquivo gerado: ' + file.filename);
}

/* ---------- importação ---------- */
function importData(d) {
  if (!d || typeof d !== 'object' || (!Array.isArray(d.weights) && !Array.isArray(d.sessions))) throw new Error('formato');
  let nw = 0, ns = 0;
  for (const w of (d.weights || [])) {
    const kg = Number(w.kg); if (!w.date || !isFinite(kg)) continue;
    const o = { date: String(w.date).slice(0, 10), kg, at: Date.now() };
    const waist = w.waist_cm ?? w.waist; if (waist != null && isFinite(Number(waist))) o.waist = Number(waist);
    S.weights = S.weights.filter(x => x.date !== o.date).concat([o]); nw++;
  }
  S.weights.sort((a, b) => a.date < b.date ? -1 : 1);
  (d.sessions || []).forEach((x, i) => {
    if (!x || !x.date || !x.template) return;
    const s = {
      id: x.id || ('imp-' + x.date + '-' + x.template + '-' + i),
      template: x.template, date: String(x.date).slice(0, 10),
      status: (x.status === 'em_andamento' || x.status === 'doing') ? 'doing' : 'done',
      startedAt: x.started_at ?? x.startedAt ?? parseDate(x.date).getTime() + 12 * 36e5,
      finishedAt: x.finishedAt ?? null, rpe: x.effort_0_10 ?? x.rpe ?? null,
      warm: x.warm || [], notes: x.notes || '', updatedAt: Date.now(), exercises: [],
    };
    if (x.slot) s.slot = x.slot;
    const dur = x.duration_min ?? x.durationMin; if (dur != null) s.durationMin = dur;
    if (x.template === 'OUTRO') s.title = x.title && x.title !== TEMPLATES.OUTRO.title ? x.title : (x.title || '');
    for (const e of (x.exercises || [])) {
      const name = e.exercise || e.name; if (!name) continue;
      s.exercises.push({ key: e.key || slug(name), exId: e.plan_id ?? e.exId ?? null, name, group: e.group || 'Extras',
        sets: (e.sets || []).map(z => ({ kg: z.kg ?? null, reps: z.reps ?? null, done: !!z.done })) });
    }
    S.sessions = S.sessions.filter(y => y.id !== s.id).concat([s]); ns++;
  });
  if (d.settings && typeof d.settings === 'object') S.profile = Object.assign({}, S.profile, { settings: Object.assign({}, settings(), d.settings) });
  else if (d.profile && d.profile.settings) S.profile = Object.assign({}, S.profile, { settings: Object.assign({}, settings(), d.profile.settings) });
  Store.persistLocal();
  return [nw, ns];
}
document.addEventListener('change', e => {
  if (e.target.id !== 'import-file') return;
  const file = e.target.files && e.target.files[0]; if (!file) return;
  file.text().then(txt => {
    const [nw, ns] = importData(JSON.parse(txt));
    toast(`Importado: ${ns} treinos e ${nw} registros de peso.`);
    render();
  }).catch(() => toast('Arquivo inválido. Use um JSON exportado por este app.'))
    .finally(() => { e.target.value = ''; });
});

press-45":"Leg_Press","hack-squat":"Hack_Squat","agachamento-goblet":"Goblet_Squat","afundo":"Dumbbell_Lunges","step-up":"Dumbbell_Step_Ups","mesa-flexora":"Lying_Leg_Curls","flexora-sentada":"Seated_Leg_Curl","stiff-com-halteres":"Stiff-Legged_Dumbbell_Deadlift","levantamento-terra-romeno":"Romanian_Deadlift","flexora-unilateral":"Standing_Leg_Curl","hip-thrust":"Barbell_Hip_Thrust","extensao-de-quadril-na-polia":"One-Legged_Cable_Kickback","panturrilha-em-pe":"Standing_Calf_Raises","panturrilha-no-leg-press":"Calf_Press_On_The_Leg_Press_Machine","prancha":"Plank","abdominal-na-polia":"Cable_Crunch"};
let howTimer = null, howStep = 0, howKey = null;
function howShow(step) {
  howStep = step;
  const img = $('#how-img'); if (!img || !howKey) return;
  img.src = 'img/' + HOW_IMG[howKey] + '/' + step + '.jpg';
  $('#how-stage').textContent = step ? 'Posição final' : 'Posição inicial';
  document.querySelectorAll('#sheet [data-act="how-step"]').forEach(b => b.classList.toggle('on', +b.dataset.v === step && !howTimer));
  const p = $('#sheet [data-act="how-play"]'); if (p) { p.classList.toggle('on', !!howTimer); p.textContent = howTimer ? 'Pausar' : 'Animar'; }
}
function howPlay(on) {
  clearInterval(howTimer); howTimer = null;
  if (on) howTimer = setInterval(() => howShow(howStep ? 0 : 1), 1100);
  howShow(howStep);
}
function openHow(key, name) {
  const sheet = $('#sheet');
  const info = Object.values(BANK).find(b => b.key === key);
  howKey = HOW_IMG[key] ? key : null;
  $('#sheet-title').textContent = name;
  $('#how-has').hidden = !howKey;
  $('#how-none').hidden = !!howKey;
  $('#how-notes').textContent = info && info.notes ? info.notes : '';
  $('#how-notes').hidden = !(info && info.notes);
  $('#how-video').href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent('como fazer ' + name);
  if (howKey) {
    for (const n of [0, 1]) { const pre = new Image(); pre.src = 'img/' + HOW_IMG[key] + '/' + n + '.jpg'; }
    howStep = 0;
    howPlay(!matchMedia('(prefers-reduced-motion: reduce)').matches);
  }
  sheet.hidden = false;
  document.body.style.overflow = 'hidden';
  $('#sheet .icon-btn').focus({preventScroll:true});
}
function closeHow() {
  const sheet = $('#sheet'); if (!sheet || sheet.hidden) return;
  clearInterval(howTimer); howTimer = null; howKey = null;
  sheet.hidden = true; document.body.style.overflow = '';
}
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeHow(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeHow(); });
window.addEventListener('hashchange', closeHow);

/* ---------- ações ---------- */
let armTimer = null;
function arm(key) { S.armed = key; clearTimeout(armTimer); armTimer = setTimeout(() => { if (S.armed === key) { S.armed = null; render(); } }, 3500); render(); }
function saveSettings(patch) {
  S.profile = Object.assign({}, S.profile, { settings: Object.assign({}, settings(), patch) });
  Store.saveProfile();
}
const A = {
  ficha: el => { S.editTpl = el.dataset.t; S.fxPick = null; go('ficha', true); },
  'ficha-back': () => go('hoje'),
  'fx-add': el => { const g = el.dataset.g; S.fxPick = S.fxPick && S.fxPick.mode === 'add' && S.fxPick.group === g ? null : {mode: 'add', group: g}; render(); },
  'fx-swap': el => { const i = +el.dataset.i; S.fxPick = S.fxPick && S.fxPick.mode === 'swap' && S.fxPick.i === i ? null : {mode: 'swap', i}; render(); },
  'fx-choose': el => {
    const tid = S.editTpl, list = lineupOf(tid, todayStr()), it = BANK[el.dataset.id], p = S.fxPick;
    if (!it || !p) return;
    if (p.mode === 'swap') { const old = lineupInfo(list[p.i]).name; list[p.i] = {exId: it.id, group: list[p.i].group}; toast(`${old} → ${it.name}`); }
    else { list.push({exId: it.id, group: p.group}); toast(`${it.name} adicionado.`); }
    S.fxPick = null; setLineup(tid, list); render();
  },
  'fx-del': el => { const tid = S.editTpl, list = lineupOf(tid, todayStr()); const [x] = list.splice(+el.dataset.i, 1); S.fxPick = null; setLineup(tid, list); toast(`${lineupInfo(x).name} removido da ficha.`); render(); },
  'fx-up': el => {
    const tid = S.editTpl, list = lineupOf(tid, todayStr()), i = +el.dataset.i;
    let j = i - 1; while (j >= 0 && list[j].group !== list[i].group) j--;
    if (j < 0) return;
    [list[j], list[i]] = [list[i], list[j]]; S.fxPick = null; setLineup(tid, list); render();
  },
  'fx-reset': () => { if (S.armed !== 'fx-reset') return arm('fx-reset'); S.armed = null; resetLineup(S.editTpl); toast('Ficha do plano restaurada.'); render(); },
  'save-lineup': () => {
    const s = S.active; if (!s) return;
    setLineup(s.template, s.exercises.map(e => BANK[e.exId] ? {exId: e.exId, group: e.group} : {name: e.name, key: e.key, group: e.group}));
    toast(`Ficha do ${TPL(s).title} atualizada.`);
  },
  how: el => openHow(el.dataset.key, el.dataset.name),
  'how-close': () => closeHow(),
  'how-step': el => { clearInterval(howTimer); howTimer = null; howShow(+el.dataset.v); },
  'how-play': () => howPlay(!howTimer),
  start: el => startSession(el.dataset.t, el.dataset.v || null, todayStr()),
  'start-any': el => { const [t, v] = el.dataset.k.split(':'); startSession(t, v || null, S.logDate || todayStr()); },
  open: el => openSession(el.dataset.id),
  back: () => { flushSave(); go(S.returnTo || 'hoje'); },
  picker: el => { S.picker = S.picker === el.dataset.g ? null : el.dataset.g; render(); },
  pick: el => {
    const s = S.active, it = BANK[el.dataset.id];
    const i = s.exercises.findIndex(e => e.exId === it.id);
    if (i >= 0) s.exercises.splice(i, 1);
    else {
      const e = makeExercise(it, it.group, s.date, s.id);
      // insere após o último exercício do mesmo grupo
      let at = -1; s.exercises.forEach((x, k) => { if (x.group === it.group) at = k; });
      s.exercises.splice(at >= 0 ? at + 1 : s.exercises.length, 0, e);
    }
    saveSoon(); render();
  },
  'ex-remove': el => {
    const ei = +el.dataset.ei;
    if (S.armed !== 'ex-' + ei) return arm('ex-' + ei);
    S.active.exercises.splice(ei, 1); S.armed = null; saveSoon(); render();
  },
  'set-add': el => {
    const e = S.active.exercises[+el.dataset.ei];
    const l = e.sets[e.sets.length - 1];
    e.sets.push({ kg: l ? l.kg : null, reps: null, done: false });
    saveSoon(); render();
    const inp = document.getElementById(`rp-${el.dataset.ei}-${e.sets.length - 1}`); if (inp) inp.focus({preventScroll:true});
  },
  'set-del': el => { const e = S.active.exercises[+el.dataset.ei]; e.sets.splice(+el.dataset.si, 1); saveSoon(); render(); },
  'set-done': el => {
    const ei = +el.dataset.ei, si = +el.dataset.si;
    const e = S.active.exercises[ei], x = e.sets[si];
    x.done = !x.done;
    if (x.done) {
      if (x.reps == null) { const rr = repRange(exInfo(e).reps); x.reps = rr.max ?? null; const r = document.getElementById(`rp-${ei}-${si}`); if (r && x.reps != null) r.value = x.reps; }
      S.lastSetAt = Date.now();
      // copia a carga para a próxima série vazia
      const nx = e.sets[si + 1]; if (nx && nx.kg == null && x.kg != null) { nx.kg = x.kg; const k = document.getElementById(`kg-${ei}-${si + 1}`); if (k) k.value = fmtKg(x.kg); }
    }
    const row = el.closest('.set'); row.classList.toggle('done', x.done); el.setAttribute('aria-pressed', x.done);
    saveSoon(); renderBar();
  },
  'apply-sug': el => { const e = S.active.exercises[+el.dataset.ei]; const kg = Number(el.dataset.kg); e.sets.forEach(x => { if (!x.done) x.kg = kg; }); saveSoon(); render(); },
  scale: el => { const f = el.dataset.f, v = +el.dataset.v; S.active[f] = S.active[f] === v ? null : v; saveSoon(); render(); },
  variant: el => { S.active.variant = el.dataset.v; saveSoon(); render(); },
  result: el => { S.active.result = el.dataset.v; saveSoon(); render(); },
  warm: el => {
    const i = +el.dataset.i, s = S.active; s.warm = s.warm || [];
    const k = s.warm.indexOf(i); if (el.checked && k < 0) s.warm.push(i); if (!el.checked && k >= 0) s.warm.splice(k, 1);
    saveSoon();
  },
  finish: () => {
    const s = S.active;
    s.status = 'done';
    if (s.date === todayStr()) { s.finishedAt = Date.now(); if (TPL(s).kind === 'gym' && !s.durationMin) s.durationMin = Math.max(1, Math.round((s.finishedAt - (s.startedAt || s.finishedAt)) / 60000)); }
    S.dirty = true; flushSave();
    toast('Treino salvo. Boa!');
    go('hoje');
  },
  reopen: () => { S.active.status = 'doing'; saveSoon(); render(); },
  'del-session': () => {
    if (S.armed !== 'del-session') return arm('del-session');
    const id = S.active.id;
    clearTimeout(saveT); S.dirty = false;
    S.sessions = S.sessions.filter(x => x.id !== id);
    S.active = null; S.armed = null;
    Store.deleteSession(id);
    toast('Registro excluído.');
    go('historico');
  },
  wrange: el => { S.wRange = el.dataset.v; render(); },
  'del-weight': el => {
    const d = el.dataset.d;
    if (S.armed !== 'w-' + d) return arm('w-' + d);
    S.weights = S.weights.filter(w => w.date !== d); S.armed = null;
    Store.deleteWeight(d); render(); toast('Registro de peso excluído.');
  },
  clear: el => { saveSettings({ [el.dataset.k]: el.checked }); render(); },
  export: el => exportFile(el.dataset.f),
  backup: el => {
    const txt = JSON.stringify(buildExport(), null, 1);
    const fallback = () => { S.backup = true; render(); const pre = $('#backup-txt'); if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast('Selecione e copie o texto abaixo.'); };
    try { navigator.clipboard.writeText(txt).then(() => toast('Backup copiado.'), fallback); } catch (e) { fallback(); }
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !A[el.dataset.act]) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') return; // tratado no change
  e.preventDefault();
  A[el.dataset.act](el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('input[type=checkbox][data-act]')) { A[el.dataset.act] && A[el.dataset.act](el, e); return; }
  const k = el.dataset.in;
  if (k === 's-date' && S.active && el.value) {
    const max = todayStr(); S.active.date = el.value > max ? max : el.value;
    saveSoon(); render();
  } else if (k === 'log-date') { S.logDate = el.value && el.value <= todayStr() ? el.value : null; render(); }
  else if (k === 'ex-sel') { S.exKey = el.value; render(); }
  else if (k === 'set') {
    let v = el.value;
    if (el.dataset.k === 'increment') { v = parseNum(v); if (v == null || v <= 0) { toast('Informe um incremento maior que zero.'); return; } }
    if (el.dataset.k === 'weeklyGoal') { v = parseInt(v, 10); if (!(v >= 1 && v <= 14)) { toast('Meta entre 1 e 14 treinos.'); return; } }
    saveSettings({ [el.dataset.k]: v }); toast('Ajuste salvo.');
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id && el.hasAttribute('data-keep')) el.dataset.touched = '1';
  const k = el.dataset.in; const s = S.active;
  if (!k || !s) return;
  if (k === 'kg' || k === 'reps') {
    const x = s.exercises[+el.dataset.ei].sets[+el.dataset.si];
    if (k === 'kg') x.kg = parseNum(el.value); else { const n = parseInt(el.value, 10); x.reps = isNaN(n) ? null : n; }
    saveSoon();
  } else if (k === 's-notes') { s.notes = el.value; saveSoon(); }
  else if (k === 's-title') { s.title = el.value; saveSoon(); }
  else if (k === 's-dur') { const n = parseInt(el.value, 10); s.durationMin = isNaN(n) ? null : n; saveSoon(); }
  else if (k === 's-score') { s.score = el.value; saveSoon(); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form;
  if (kind === 'weight' || kind === 'qweight') {
    const kg = parseNum((kind === 'weight' ? $('#w-kg') : $('#qw-kg')).value);
    if (kg == null || kg < 25 || kg > 300) { toast('Informe o peso em kg, por exemplo 82,4.'); return; }
    const date = kind === 'weight' ? ($('#w-date').value || todayStr()) : todayStr();
    if (date > todayStr()) { toast('A data não pode estar no futuro.'); return; }
    const waist = kind === 'weight' ? parseNum($('#w-waist').value) : null;
    const prev = S.weights.find(w => w.date === date);
    const w = { date, kg, at: Date.now() };
    if (waist != null) w.waist = waist; else if (prev && prev.waist != null) w.waist = prev.waist;
    S.weights = S.weights.filter(x => x.date !== date).concat([w]).sort((a, b) => a.date < b.date ? -1 : 1);
    Store.saveWeight(w);
    f.querySelectorAll('[data-keep]').forEach(i => { delete i.dataset.touched; });
    toast(prev ? `Peso de ${fmtD(date)} atualizado: ${fmtKg(kg)} kg.` : `Peso salvo: ${fmtKg(kg)} kg.`);
    render();
    if (kind === 'weight') { const i = $('#w-kg'); if (i) i.value = ''; }
  } else if (kind === 'add-ex') {
    const inp = $('#custom-name'); const name = (inp.value || '').trim();
    if (!name) { toast('Digite o nome do exercício.'); return; }
    const s = S.active, T = TPL(s);
    const b = BANK_BY_NAME[name.toLowerCase()];
    const group = T.groups && T.groups.length ? 'Extras' : 'Exercícios';
    const info = b || { name, key: slug(name), reps:'', sets:'3', load:true, region:'upper', role:'C' };
    s.exercises.push(makeExercise(info, group, s.date, s.id));
    delete inp.dataset.touched; inp.value = '';
    saveSoon(); render();
  } else if (kind === 'fx-custom') {
    const inp = $('#fx-name'); const name = (inp.value || '').trim();
    if (!name) { toast('Digite o nome do exercício.'); return; }
    const tid = S.editTpl, T = TEMPLATES[tid];
    const list = lineupOf(tid, todayStr());
    const b = BANK_BY_NAME[name.toLowerCase()];
    const group = T.groups && T.groups.length ? 'Extras' : 'Exercícios';
    list.push(b ? {exId: b.id, group} : {name, key: slug(name), group});
    delete inp.dataset.touched; inp.value = '';
    setLineup(tid, list); toast('Exercício adicionado à ficha.'); render();
  }
});

let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------- início ---------- */
Store.init();
route();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
